<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oficina Maven</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Aplica o tema salvo antes de pintar a página, para não piscar.
    try {
      const tema = localStorage.getItem("tema");
      if (tema === "claro" || tema === "escuro") document.documentElement.dataset.theme = tema === "claro" ? "light" : "dark";
    } catch {}
  </script>
</head>
<body>
  <form id="formulario" novalidate>
    <header class="topo">
      <h1><span class="marca">oficina</span> maven</h1>
      <div class="tema" role="group" aria-label="Tema">
        <button type="button" data-tema="light" aria-label="Tema claro" title="Tema claro">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
        </button>
        <button type="button" data-tema="dark" aria-label="Tema escuro" title="Tema escuro">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
        </button>
      </div>
    </header>

    <main class="colunas">
      <div class="esquerda">
        <section>
          <h2>Dados do projeto</h2>
          <div class="linha">
            <label for="groupId">Group</label>
            <input id="groupId" value="com.exemplo" autocomplete="off" spellcheck="false">
          </div>
          <div class="linha">
            <label for="artifactId">Artifact</label>
            <input id="artifactId" value="meu-projeto" autocomplete="off" spellcheck="false">
          </div>
          <div class="linha">
            <label for="versao">Versão</label>
            <input id="versao" value="1.0.0-SNAPSHOT" autocomplete="off" spellcheck="false">
          </div>
          <div class="linha">
            <label for="descricao">Descrição</label>
            <input id="descricao" value="Projeto Java com Maven" autocomplete="off">
          </div>
          <fieldset class="linha">
            <legend>Empacotamento</legend>
            <div class="opcoes">
              <label><input type="radio" name="empacotamento" value="jar" checked> Jar</label>
              <label><input type="radio" name="empacotamento" value="war"> War</label>
            </div>
          </fieldset>
          <fieldset class="linha">
            <legend>Java</legend>
            <div class="opcoes">
              <label><input type="radio" name="java" value="25"> 25</label>
              <label><input type="radio" name="java" value="21"> 21</label>
              <label><input type="radio" name="java" value="17" checked> 17</label>
              <label><input type="radio" name="java" value="11"> 11</label>
              <label><input type="radio" name="java" value="8"> 8</label>
            </div>
          </fieldset>
        </section>
      </div>

      <aside class="direita">
        <div class="direita-topo">
          <h2>pom.xml</h2>
        </div>
        <p id="erro" role="alert"></p>
        <p id="aviso" role="status"></p>
        <pre id="previa" tabindex="0" aria-label="Prévia do pom.xml"></pre>
      </aside>
    </main>

    <footer class="barra">
      <button type="submit"><strong>Baixar</strong> <span class="atalho">Ctrl + ⏎</span></button>
      <button type="button" id="copiar"><strong>Copiar</strong></button>
    </footer>
  </form>

  <script src="zip.js"></script>
  <script src="app.js"></script>
</body>
</html>
